version: 2

# Exasol copies of upstream dbt_utils tests on seeds with reserved-word columns.
# Upstream refers to these columns unquoted; here they are quoted.

models:
  - name: data_test_at_least_one_quoted
    columns:
      - name: field
        quote: true
        data_tests:
          - dbt_utils.at_least_one
      - name: value
        quote: true
        data_tests:
          - dbt_utils.at_least_one:
              arguments:
                group_by_columns: ['"field"']
              config:
                error_if: "<1"
                warn_if: "<0"

  - name: data_unique_combination_of_columns_quoted
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - '"month"'
              - '"product"'
